; A program on the SmartOS kernel, and nothing else.
;
;   PLATFORMIO_BUILD_DIR=.pio/cli pio run -t upload
;
; Run it from THIS directory, not the project root. It borrows
; ../../components/smartos and shares nothing else with the operating system.
[env:kernel-blink]
platform      = espressif32
board         = esp32-s3-devkitc-1
framework     = espidf
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_flags =
    -D SMARTOS_ENABLE_PREEMPT
