; Project S3 - custom OS for ESP32-S3-N16R8
; board: ESP32-S3 DevKitC-1  (16MB QIO flash + 8MB OPI PSRAM)

[env:s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

; ---- N16R8 memory layout -------------------------------------------------
; qio_opi = QIO flash + Octal PSRAM. This MUST match the module or PSRAM
; will silently fail to initialise (heap_caps reports 0 bytes SPIRAM).
board_build.arduino.memory_type = qio_opi
board_build.flash_mode          = qio
board_build.psram_type          = opi
board_upload.flash_size         = 16MB
board_upload.maximum_size       = 16777216
board_build.partitions          = default_16MB.csv

; ---- serial --------------------------------------------------------------
monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -I src                        ; let sources include "hal/..." / "board/..."
    -D BOARD_HAS_PSRAM
    -D ARDUINO_USB_MODE=1         ; native USB
    -D ARDUINO_USB_CDC_ON_BOOT=1  ; Serial = USB CDC on the USB port
    -D CORE_DEBUG_LEVEL=3

; The panel ID can only be read if the module has its SDO resistor fitted.
; If the probe comes back UNKNOWN and the colours look wrong, name the
; controller here instead of guessing: ILI9488 / ILI9486 / ST7796.
;   -D LCD_FORCE_CTRL=LCD_CTRL_ST7796
