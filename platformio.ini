; Project S3 - custom OS for ESP32-S3-N16R8
; board: ESP32-S3 DevKitC-1  (16MB QIO flash + 8MB OPI PSRAM)
;
; Stage 2.0: moved off the Arduino core to bare ESP-IDF so we own sdkconfig.
; That is what unlocks the L4 plan - FreeRTOS is pinned to core 0 (unicore)
; and core 1 is left asleep for the kernel to claim in stage 2.1.

[env:s3-n16r8]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = espidf

board_build.partitions = partitions.csv

; The esp32-s3-devkitc-1 board definition defaults to the N8 variant (8 MB
; flash, no PSRAM). Ours is N16R8, so correct the flash size here - the PSRAM
; side is handled by CONFIG_SPIRAM_* in sdkconfig.defaults.
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216

; Keep managed_components/ (littlefs, fetched from the Espressif registry)
; between configures. PlatformIO's default re-extracts it on every one - meant
; for projects that build several targets from one folder, which this is not.
; One re-extraction failed its integrity check ("Path ... src/littlefs/.git
; does not exist") and left the component half-deleted; with this off, the
; component's files stay untouched across reconfigures (checked).
board_build.esp-idf.overwrite_managed_components = no

monitor_speed   = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed    = 921600

build_flags =
    -I src                    ; let sources include "s3hal/..." / "board/..."
    -D S3_ENABLE_PREEMPT
    -D S3_ENABLE_SMP
    -D LCD_FORCE_CTRL=LCD_CTRL_ST7789   ; 2.4" 240x320, ST7789V

; ---------------------------------------------------------------------------
; Optional flags. Uncomment by moving the line up into build_flags above.
;
;   -D S3_ENABLE_PREEMPT   (currently ON, in build_flags above)
;       Let the tick switch tasks rather than only count them. Remove it to
;       get the cooperative scheduler back - useful for telling apart a bug in
;       the kernel from a bug in the interrupt entry.
;
;   -D S3_PREEMPT_SOAK
;       Replace the demo with two tasks that never yield - the smallest thing
;       that can prove preemption works. Use together with S3_ENABLE_PREEMPT.
;
;   -D S3_TEST_STACK_OVERFLOW
;       Adds a task that overruns its stack on purpose, to check the guard
;       reports it. Verified: ktop names the task and its high-water reads
;       full, with no hang and no watchdog.
;
;   -D S3_TEST_APPS
;       The tests that open apps: Home driven by script (open, use, hold BACK
;       to close, reopen from scratch), the app-model and SDK live tests, then
;       every test app closed again. Not part of a normal boot, because on a
;       normal boot only the user opens apps.
;
;   -D S3_TEST_APPHOG   (implies S3_TEST_APPS)
;       After the app-model script, starts an app whose init() never returns
;       next to the 50 Hz bounce app. Bounce must hold 50 frames/s and the
;       input sampler 500 passes/s. The hog cannot hear a stop request; since
;       stage 5.2 it is killed when the test apps are closed, 2 s after being
;       asked (APP_STOP_GRACE_MS).
;
;   -D S3_TEST_KILL_NOFORGET   (with S3_TEST_APPS)
;       Stage 5.2's proof: kills without clearing the dead app's mailbox slots.
;       Expected to FAIL "kill: mailbox call in flight" and "nothing left
;       behind" with "mailbox 7/8 empty" - one slot lost for good, its job run
;       into a stack that was already given back.
;
;   -D S3_TEST_PANIC_REBOOT
;       Crashes core 0 on purpose while core 1 runs, exactly once (a marker
;       file in /fs/sys decides), and checks the boot after it has no core 1
;       fault and a ticking kernel. Proves the esp_restart_noos wrap in
;       kernel/kcore1.cpp: without it, that boot faults on core 1.
;
;   -D S3_TEST_PARK
;       Core 1 runs flash-resident code and writes PSRAM flat out while core 0
;       erases, writes and verifies the 'scratch' partition's last sector 40
;       times under a park. Must end "40 rounds verified ... OK" with the kernel
;       clock matching esp_timer. Erases flash: a test build, not a habit.
;
;   -D S3_TEST_PARK_OFF
;       The same with the park switched off. Expected to CRASH (core 1
;       LoadProhibited on a garbage address read through the dead cache) -
;       it is the proof that the park is doing something.
;
;   -D S3_TEST_EVBUS
;       The event bus under load: a publisher on each core (2000 events each),
;       two blocking subscribers on task ids 17 and 18 (sixteen filler tasks
;       take 0-15 so the widened wait-set bits get used), a subscriber that
;       never reads, a 20 ms timer checked for lateness, and a 5 ms timer held
;       off for 50 ms. Every line must end OK.
;
;   -D S3_TEST_MBOX_STRESS
;       Four mailbox posters, two pinned to each core, 250 checked sums each,
;       then deliberate timeouts, then 50 more sums. Also holds kmbox_post's
;       race window open for 20 us. Must end "0 wrong" on every poster and
;       "mailbox after: empty=8 ... OK". Re-run after any change to kmbox.
;
;   -D S3_TEST_SLEEP_CLAIM
;       One task free to run on either core sleeps 3000 times alone on core 1
;       while core 0 sits in the scheduler. Before the fix in pick_next, core 0
;       claimed it from a stale context and the board boot-looped on a double
;       exception; now it must report "0 times a second copy ... OK". Re-run it
;       after any change to pick_next, k_yield or k_sleep_ms.
;
;   -D S3_TEST_CORE1_FAULT
;       Make core 1 dereference NULL on purpose, to check that the fault
;       recorder and core 0's report actually work.
;
;   -D S3_GFX_SELFTEST
;       Draw the four-corner panel test instead of the demo scene: red top
;       left, green top right, blue bottom left, white bottom right, a wide
;       yellow bar across the middle, on black. Each element fails differently
;       for inversion, colour order and rotation, which is what made an
;       inverted AND mirrored panel diagnosable at all.
;
;   NOTE (stage 3.4): LCD_MAX_TRANSFER in src/s3hal/lcd_bus.h is now 8192 and
;       decides how many SPI transactions a frame costs - 20 instead of 240.
;       Raising it further buys almost nothing (overhead is already 0.8 ms
;       against 15.4 ms of wire time) and costs internal RAM, since there are
;       two staging buffers of that size.
;
;   -D LCD_PROBE_SCAN_DUMMY
;       Dump the panel ID read at every dummy-cycle count and on both sampling
;       edges. Used once to establish that this module's SDO never reaches the
;       controller - keep it for the next board that will not identify itself.
;
;   -D LCD_FORCE_CTRL=...   (currently ST7789, in build_flags above)
;       The panel ID can only be read if the module has its SDO resistor
;       fitted. If the probe comes back UNKNOWN and the colours look wrong,
;       name the controller here instead of guessing:
;       LCD_CTRL_ILI9488 / LCD_CTRL_ILI9486 / LCD_CTRL_ST7796
;
; NOTE: PlatformIO's ESP-IDF integration does not always notice a build_flags
; change. After changing build_flags (or adding a file to src/apps/), delete
; the whole build folder, .pio/build/s3-n16r8/, then build - and confirm from
; the serial log which tests actually ran. A reconfigure rebuilds everything
; either way, so the full delete costs nothing extra.
;
;
; COMMAND-LINE BUILDS USE THEIR OWN FOLDER. With this project open in VS Code,
; the PlatformIO extension runs builds of its own - "project init --ide
; vscode", and "load_build_metadata" - in .pio/build, whenever this file or the
; build folder changes: one took 94 s. A command-line build in the same folder
; collides with them, in whatever way the timing gives: files that "do not
; exist" a moment after being written, "Permission denied", "Device or resource
; busy", a missing managed-components list, esp_littlefs.h not found, a littlefs
; component left half-deleted. Waiting for the editor to go quiet (stage 5.3)
; was not enough - it also starts when the build folder is deleted. So builds
; from the command line set PLATFORMIO_BUILD_DIR=.pio/cli, and the editor keeps
; .pio/build to itself:
;
;     PLATFORMIO_BUILD_DIR=.pio/cli pio run -t upload
;
; (Stages 4.5 to 5.2 blamed deleting only CMakeCache.txt, then Windows
; Defender; 5.3 caught the editor at it.)
; ---------------------------------------------------------------------------
